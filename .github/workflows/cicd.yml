name: CDK CI/CD

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm ci --prefix cdk

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::650251698778:role/GitHubCdkDeploy   # <-- thay bằng ARN của bạn
          aws-region: ap-southeast-1                                       # <-- đổi REGION nếu khác

      - name: CDK synth
        run: |
          cd cdk
          npx cdk synth

      - name: CDK deploy
        run: |
          cd cdk
          npx cdk deploy --require-approval never